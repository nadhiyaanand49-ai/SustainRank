# Java PBL - B.Tech IT 2nd Year, 3rd Sem (Harshini V & Nadhiya A)
# ===================================================================

# Application Info
spring.application.name=SustainRank
server.port=8080

# Persistent H2 Database Configuration (Files saved to ./data/sustainrank.mv.db)
spring.datasource.url=jdbc:h2:file:./data/sustainrank;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Demo Account Credentials (Used by Spring Security)
# In production, change these or manage users via database user entities.
sustainrank.security.demo-username=admin
sustainrank.security.demo-password=admin123
sustainrank.security.demo-role=ADMIN

# Sustainability Assessment Defaults (Equal 25% weight per criterion)
sustainrank.weights.environmental=0.25
sustainrank.weights.innovation=0.25
sustainrank.weights.social=0.25
sustainrank.weights.financial=0.25

# Logging
logging.level.com.sustainrank=INFO
logging.level.org.springframework.security=WARN
