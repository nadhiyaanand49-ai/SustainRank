<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | SustainRank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center p-4">
<div class="text-center" style="max-width: 500px;">
    <div class="display-1 fw-bold text-emerald mb-2">404</div>
    <h3 class="fw-bold text-dark mb-2" th:text="${errorTitle != null ? errorTitle : 'Page Not Found'}">Record Not Found</h3>
    <p class="text-muted small mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested resource or startup identifier could not be located in the database.'}">
        The resource you are looking for does not exist.
    </p>
    <a th:href="@{/dashboard}" class="btn btn-emerald px-4">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>
</body>
</html>
