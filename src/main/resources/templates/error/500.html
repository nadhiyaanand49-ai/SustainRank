<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | SustainRank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center p-4">
<div class="text-center" style="max-width: 540px;">
    <div class="display-1 fw-bold text-danger mb-2">500</div>
    <h3 class="fw-bold text-dark mb-2" th:text="${errorTitle != null ? errorTitle : 'Application Error'}">Unexpected Error</h3>
    <div class="alert alert-light border text-start small mb-4 p-3" th:if="${errorMessage}">
        <strong>Details:</strong> <span th:text="${errorMessage}">Error message details.</span>
    </div>
    <a th:href="@{/dashboard}" class="btn btn-emerald px-4">
        <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
    </a>
</div>
</body>
</html>
